# ── Memory Gateway v4 ─ Docker Compose ─────────────────
# 部署到 1Panel / 阿里云:
#   1. git clone https://github.com/kiDemon/memory-gateway.git
#   2. cd memory-gateway && docker compose up -d
#   3. docker logs memory-gateway  ← 查看自动生成的 API Key
#   4. 防火墙放行 8650 端口
# ─────────────────────────────────────────────────────────

services:
  memory-gateway:
    build: .
    container_name: memory-gateway
    restart: unless-stopped
    ports:
      - "${MEMORY_PORT:-8650}:8650"
    environment:
      - MEMORY_DATA_DIR=/data
      - MEMORY_HOST=0.0.0.0
      - MEMORY_PORT=8650
    volumes:
      # 数据持久化 — 备份只需拷走这个目录
      - ./data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8650/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
