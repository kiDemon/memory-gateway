# ── Memory Gateway ─ Docker Compose ────────────────────
# 部署到 1Panel / 阿里云:
#   1. 上传整个 memory-gateway 目录
#   2. 复制 .env.example 为 .env 并修改 API Key
#   3. mkdir -p ./data && chmod 777 ./data
#   4. docker compose up -d
# ─────────────────────────────────────────────────────────

services:
  memory-gateway:
    build: .
    container_name: memory-gateway
    restart: unless-stopped
    ports:
      - "${MEMORY_PORT:-8650}:8650"
    env_file:
      - .env
    environment:
      - MEMORY_DATA_DIR=/data
      - MEMORY_HOST=0.0.0.0
      - MEMORY_PORT=8650
    volumes:
      # 数据持久化 — 备份只需拷走这个目录
      - ./data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8650/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
